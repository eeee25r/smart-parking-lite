<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Smart Parking Dashboard</title>
    <style>
        body {
            font-family: sans-serif;
            background: #222;
            color: #fff;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        .card {
            background: #333;
            padding: 20px;
            display: inline-block;
            border-radius: 8px;
            margin: 15px;
            border: 2px solid #00ffcc;
            vertical-align: top;
        }

        img {
            width: 400px;
            height: 300px;
            object-fit: cover;
            border-radius: 5px;
            display: block;
            margin-top: 10px;
        }
        .audio-container {
            margin-top: 40px;
            padding: 15px;
            background: #111;
            display: inline-block;
            border-radius: 30px;
            border: 1px solid #00ffcc;
        }
    </style>
</head>

<body>
    <h1>Smart Parking - License Plate Log</h1>

    <div class="card">
        <h3>Camera #1 - Gate Entry - car number: 1</h3>
        <img src="http://localhost:8081/car1.jpg" alt="Car 1">
    </div>

    <div class="card">
        <h3>Camera #1 - Gate Entry - car number: 2</h3>
        <img src="http://localhost:8081/car2.jpg" alt="Car 2">
    </div>

    <div class="card">
        <h3>Camera #1 - Gate Entry - car number: 3</h3>
        <img src="http://localhost:8081/car3.jpg" alt="Car 3">
    </div>

    <div class="audio-container">
        <h3> Beatbox Mode</h3>
        <audio controls autoplay loop>
            <source src="beatbox-verity.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
</body>

</html>
